apiVersion: apps/v1
kind: Deployment
metadata:
  name: industrial-nlp-api
  namespace: ml-pipelines # Синхронизировали с пространством имен наших DAG-ов
  labels:
    app: nlp-api
spec:
  replicas: 1 # Начинаем с одной копии для экономии GPU
  selector:
    matchLabels:
      app: nlp-api
  template:
    metadata:
      labels:
        app: nlp-api
      annotations:
        # МАГИЯ МОНИТОРИНГА: Prometheus сам найдет это
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: fastapi-server
        image: my-company/industrial_nlp_template:latest # Синхронизировано с PROJECT_IMAGE
        ports:
        - containerPort: 8000
        
        # Подключаем секреты 
        envFrom:
        - secretRef:
            name: nlp-api-secrets
            
        # Монтируем диск с моделями
        volumeMounts:
        - name: model-weights
          mountPath: /app/models
          
        # ЖЕЛЕЗО: Обязательно ограничиваем аппетиты модели
        resources:
          requests:
            cpu: "2"
            memory: "8Gi"
          limits:
            cpu: "4"
            memory: "16Gi"
            nvidia.com/gpu: "1" # Критично для работы ML

        # READINESS: Не даем трафик, пока веса не загрузятся в VRAM
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
          successThreshold: 1

        # LIVENESS: Убиваем, если он намертво завис
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60 # Даем больше времени на холодный старт модели!
          periodSeconds: 15
          
      volumes:
      - name: model-weights
        persistentVolumeClaim:
          claimName: pvc-models