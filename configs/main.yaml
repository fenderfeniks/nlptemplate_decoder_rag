# configs/main.yaml
defaults:
  # ── Инфраструктура (осталась на месте) ───────────────────────────────────
  - paths: default
  - system: default                 
  - logger/pylightning: pylightning_mlflow
  - logger/registry: registry_mlflow

  # ── Данные (переехали физически, но остались на месте логически) ──────────
  - decoder_pipeline/data: sft      # sft | cpt                
  
  # ── Модель ───────────────────────────────────────────────────────────────
  - decoder_pipeline/model: default

  # ── Обучение ─────────────────────────────────────────────────────────────
  - decoder_pipeline/optimizer: adamw
  - decoder_pipeline/scheduler: cosine_warmup
  - decoder_pipeline/trainer: default

  # ── Инференс ─────────────────────────────────────────────────────────────
  - decoder_pipeline/inference: default

  # ── Прочее ───────────────────────────────────────────────────────────────
  - prompts: default
  - strings: default
  
  # ── API ──────────────────────────────────────────────────────────────────
  - api: fastapi
  
  # ── Окружение (последним!) ───────────────────────────────────────────────
  - environment: local          # local | prod      
  - _self_

# ── Глобальные параметры ───────────────────────────────────────────────────
seed: 42
max_length: 2048          
pipeline_name: "decoder_pipeline"
project_name: "industrial_nlp_template" 

# ── Системные ресурсы ──────────────────────────────────────────────────────
system:
  num_proc: 4             
  num_workers: 4          
  pin_memory: true