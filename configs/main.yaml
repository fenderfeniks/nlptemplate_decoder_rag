# configs/main.yaml
# Корневой конфиг. Запуск: python train.py
# Оверрайды через CLI: python train.py model/architecture=Qwen2.5-1.5B data=sft environment=local

defaults:
  # ── Инфраструктура ───────────────────────────────────────────────────────
  - paths: default
  - system: default                 # num_proc, num_workers, pin_memory
  - logger/pylightning: pylightning_mlflow
  - logger/registry: registry_mlflow

  # ── Данные ───────────────────────────────────────────────────────────────
  - data: cpt                       # sft | cpt
  # ── Модель ───────────────────────────────────────────────────────────────
  - model: default

  # ── Обучение ─────────────────────────────────────────────────────────────
  - optimizer: adamw
  - scheduler: cosine_warmup
  - trainer: default

  # ── Инференс ─────────────────────────────────────────────────────────────
  - inference: default

  # ── Прочее ───────────────────────────────────────────────────────────────
  - prompts: default
  - strings: default
  # ── API ──────────────────────────────────────────────────────────────────
  - api: fastapi
  # ── Окружение (последним! перекрывает всё ниже) ─────────────────────────────
  - environment: local               # local | prod
  - _self_

# ── Глобальные параметры ─────────────────────────────────────────────────────
# Единственное место где они объявлены. Все конфиги ссылаются через ${seed}, ${max_length}.
seed: 42
max_length: 2048          # Максимальная длина последовательности — тянется в data и model

# ── Системные ресурсы (переопределяются в environment) ───────────────────────
system:
  num_proc: 4             # CPU-процессы для обработки датасета (datasets.map)
  num_workers: 4          # DataLoader workers
  pin_memory: true        # Ускоряет CPU→GPU трансфер при num_workers > 0