# configs/main.yaml
defaults:
  # ── Инфраструктура (осталась на месте) ───────────────────────────────────
  - paths: default
  - system: default                 
  - logger/pylightning: pylightning_mlflow
  - logger/registry: registry_mlflow

  # ── Данные (переехали физически, но остались на месте логически) ──────────
  - main_model/data: sft      # sft | cpt                
  
  # ── Модель ───────────────────────────────────────────────────────────────
  - main_model/model: default

  # ── Обучение ─────────────────────────────────────────────────────────────
  - main_model/optimizer: adamw
  - main_model/scheduler: cosine_warmup
  - main_model/trainer: default

  # ── Инференс ─────────────────────────────────────────────────────────────
  - main_model/inference: default

  # ── Прочее ───────────────────────────────────────────────────────────────
  - main_model/prompts@prompts: default
  - main_model/strings@strings: default
  
  # ── API ──────────────────────────────────────────────────────────────────
  - api: fastapi
  
  # ── Окружение (последним!) ───────────────────────────────────────────────
  - environment: local          # local | prod      
  - _self_

# ── Глобальные параметры ───────────────────────────────────────────────────
seed: 42
max_length: 2048          

# ── Системные ресурсы ──────────────────────────────────────────────────────
system:
  num_proc: 4             
  num_workers: 4          
  pin_memory: true