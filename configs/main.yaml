# configs/main.yaml
defaults:
  - paths: default
  - system: default                 
  - logger/pylightning: pylightning_mlflow
  - logger/registry: registry_mlflow

  # ── Decoder Pipeline ──────────────────────────────────────────────────────
  - decoder_pipeline/data: sft
  - decoder_pipeline/model: default
  - decoder_pipeline/optimizer: adamw
  - decoder_pipeline/scheduler: cosine_warmup
  - decoder_pipeline/training: default
  - decoder_pipeline/inference: default
  - decoder_pipeline/api: fastapi

  # ── RAG Pipeline ──────────────────────────────────────────────────────────
  - rag_pipeline/data: contrastive
  - rag_pipeline/model: default
  - rag_pipeline/optimizer: adamw
  - rag_pipeline/scheduler: cosine_warmup
  - rag_pipeline/loss: mnrl
  - rag_pipeline/training: default
  - rag_pipeline/inference: embedder
  - rag_pipeline/retrieval: retriever
  - rag_pipeline/indexing: indexer
  - rag_pipeline/api: fastapi

  # ── Векторная БД ──────────────────────────────────────────────────────────
  - vector_db: flat

  # ── Telegram-бот ──────────────────────────────────────────────────────────
  - tg_bot: default

  # ── Application layer (оркестратор, LlamaIndex) ───────────────────────────
  - application/orchestrator: orchestrator
  - application/llamaindex: llamaindex

  # ── Прочее ────────────────────────────────────────────────────────────────
  - prompts: default
  - strings: default

  # ── Окружение (последним!) ────────────────────────────────────────────────
  - environment: local
  - _self_

seed: 42
max_length: 2048
pipeline_name: "rag_pipeline"
project_name: "industrial_nlp_template"

system:
  num_proc: 4
  num_workers: 4
  pin_memory: true