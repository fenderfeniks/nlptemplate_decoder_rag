# @package _global_
# configs/environment/local.yaml
# Локальная отладка: CPU/одна GPU, урезанный датасет, короткое обучение.
# Smoke-test запуск: python train.py environment=local
#
# Цель: убедиться что весь пайплайн проходит за < 2 минут без ошибок.
# НЕ предназначен для получения осмысленных весов модели.

environment:
  name: "local"

trainer:
  accelerator: "auto"           # CPU если нет GPU — не падает с ошибкой
  precision: "32-true"          # fp32 — стабильнее на CPU, не требует Ampere
  max_steps: 100                 # Минимально для проверки цикла train→val→checkpoint
  val_check_interval: 50        # Валидация на шаге 10 и 20
  limit_train_batches: 1.0      # Убираем limit — управляем через max_steps
  limit_val_batches: 5          # 5 валидационных батчей достаточно для smoke-test
  accumulate_grad_batches: 1    # Без аккумуляции — быстрее итерация
  num_sanity_val_steps: 1

system:
  num_proc: 2
  num_workers: 0                # 0 обязателен на Windows и в отладчике
  pin_memory: false             # pin_memory бесполезен при num_workers=0

data:
  max_samples: 200              # Ровно то о чём говорили — аналог max_samples в dataloading
  max_length: 256               # Короткие последовательности → меньше памяти и времени
  dataloader:
    batch_size: 2