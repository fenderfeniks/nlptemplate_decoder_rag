# @package _global_
# configs/environment/local.yaml
# Локальная отладка: CPU/одна GPU, урезанный датасет, короткое обучение.
# Smoke-test запуск: python train.py environment=local
#
# Цель: убедиться что весь пайплайн проходит за < 2 минут без ошибок.
# НЕ предназначен для получения осмысленных весов модели.

environment:
  name: "local"

system:
  num_proc: 2
  num_workers: 0                
  pin_memory: false             

decoder_pipeline:
  training:
    accelerator: "auto"           
    precision: "32-true"          
    max_steps: 100                 
    val_check_interval: 50        
    limit_train_batches: 1.0      
    limit_val_batches: 5          
    accumulate_grad_batches: 1    
    num_sanity_val_steps: 1

  data:
    max_samples: 200              
    max_length: 256               
    dataloader:
      batch_size: 2

rag_pipeline:
  training:
    accelerator: "auto"           
    precision: "32-true"          
    max_steps: 100                 
    val_check_interval: 50        
    limit_train_batches: 1.0      
    limit_val_batches: 5          
    accumulate_grad_batches: 1    
    num_sanity_val_steps: 1

  data:
    max_samples: 200              
    max_length: 256               
    dataloader:
      batch_size: 2