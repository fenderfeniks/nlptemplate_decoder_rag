# @package _global_
# configs/environment/prod.yaml
environment:
  name: "prod"

system:
  num_proc: 8
  num_workers: 4
  pin_memory: true

decoder_pipeline:
  training:
    accelerator: "gpu"
    precision: "bf16-mixed"
    limit_train_batches: 1.0
    limit_val_batches: 1.0
    num_sanity_val_steps: 0  # добавить — на проде не нужен

  data:
    max_samples: null
    dataloader:
      batch_size: 2

rag_pipeline:
  training:
    accelerator: "gpu"
    precision: "bf16-mixed"
    limit_train_batches: 1.0
    limit_val_batches: 1.0
    num_sanity_val_steps: 0  # добавить

  data:
    max_samples: null
    dataloader:
      batch_size: 2