# configs/model/architecture/llama3_8b.yaml

model_name: "meta-llama/Meta-Llama-3-8B"
is_causal_lm: True

# Перезаписываем параметры внутри словаря builder
builder:
  auto_model_class: "transformers.AutoModelForCausalLM"
  torch_dtype: "bfloat16"
  
  # Добавляем новый блок, которого не было в скелете
  quantization_config:
    load_in_4bit: True
    bnb_4bit_compute_dtype: "bfloat16"
    bnb_4bit_use_double_quant: True
    bnb_4bit_quant_type: "nf4"

  # Настройки LoRA (если закомментировать — будет full-finetune)
  peft_config:
      r: 16                     # Ранг матриц (размер адаптера)
      lora_alpha: 32            # Сила адаптера
      lora_dropout: 0.05
      bias: "none"
      task_type: "CAUSAL_LM"
      # Для Llama 3 цепляем адаптеры ко всем линейным слоям внимания и MLP
      target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]