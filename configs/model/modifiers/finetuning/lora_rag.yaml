_target_: src.pipelines.base.core.models.modifiers.PEFTModifier
gradient_checkpointing: true
is_quantized: ${oc.select:model.quantization.quantization_config,null}
is_trainable: true
peft_config:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: none
  task_type: CAUSAL_LM
  target_modules:
    - "query"
    - "key"
    - "value"