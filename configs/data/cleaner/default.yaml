_target_: src.pipelines.base.core.data.cleaners.TextCleaningPipeline
cleaners:
  - _target_: src.pipelines.base.core.data.cleaners.RegexCleaner
    pattern: "https?://\\S+"
    replacement: ""
  - _target_: src.pipelines.base.core.data.cleaners.RegexCleaner
    pattern: "<[^>]+>"
    replacement: ""
  - _target_: src.pipelines.base.core.data.cleaners.RegexCleaner
    pattern: "\\s{2,}"
    replacement: " "