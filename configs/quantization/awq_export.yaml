# configs/quantization/awq_export.yaml
# Параметры офлайн AWQ-квантизации (scripts/tools/quantize_awq.py)
# Подключается через defaults или передаётся через CLI: +quantization=awq_export

awq:
  # Битность весов. 4 — золотой стандарт (память /4, скорость выше fp16).
  # 8 — почти нет смысла. 2 — только для 70B+ когда 4bit не влезает.
  w_bit: 4

  # Размер группы квантизации. 128 — стандарт.
  # Меньше (64) — чуть лучше качество, больше overhead по памяти.
  # Больше (256) — хуже качество, меньше overhead.
  q_group_size: 128

  # Zero-point квантизация — асимметричная, лучше для несимметричных распределений весов.
  # Почти всегда True.
  zero_point: true

  # GEMM — быстрее на батчах (eval, batch inference).
  # GEMV — быстрее на одиночных запросах (batch_size=1, чат).
  version: "GEMM"

  # Количество калибровочных сэмплов из бенчмарка.
  # 128 — стандарт AWQ, больше не улучшает качество.
  n_calib_samples: 128