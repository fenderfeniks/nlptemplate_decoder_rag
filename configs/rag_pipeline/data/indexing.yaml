defaults:
  - source: hf
  - splitter: default
  - collator: indexing
  - transforms/validation: validation_indexing
  - transforms/cleaning: cleaning
  - transforms/deduplication: minhash
  - transforms/chunking: chunking      # Специфично для RAG
  - transforms/metadata: metadata_injector      # Специфично для RAG
  - transforms/tokenization: tokenization_indexing
  - transforms/filtering: default
  - _self_

task: "indexing"

# ==========================================
# ГРУППА 1: БАЗОВЫЕ НАСТРОЙКИ
# ==========================================
dataset_name: "rag_knowledge_base"
seed: ${seed}
max_samples: null
force_reprocess: false

val_size: 0.0 # Для индексации обычно не нужны валидационные сплиты
test_size: 0.0

# ==========================================
# ГРУППА 2: ПАРАМЕТРЫ ТРАНСФОРМАЦИЙ
# ==========================================
text_column: "sentence1"
# Поля для contrastive здесь null
query_column: null
positive_column: null
negative_column: null

# Параметры чанкинга
chunk_size: 500
chunk_overlap: 50

max_length: ${max_length}
num_proc: ${system.num_proc}
batch_size: 1000

cleaner:
  _target_: src.rag_pipeline.core.data.cleaners.TextCleaningPipeline
  cleaners: []

# ==========================================
# ГРУППА 3: DATALOADER И ПУТИ
# ==========================================
paths:
  processed_data_dir: "${paths.processed_data_dir}/indexing"

dataloader:
  batch_size: 32  # Для инференса/индексации можно ставить батч побольше
  num_workers: ${system.num_workers}
  pin_memory: ${system.pin_memory}