defaults:
  - source: hf
  - splitter: default
  - collator: contrastive
  - transforms/validation: validation_contrastive
  - transforms/cleaning: default
  - transforms/deduplication: exact   # Для пар Q&A лучше точная дедупликация
  - transforms/tokenization: tokenization_contrastive
  - transforms/filtering: default
  # chunking и metadata здесь НЕ подключаются
  - _self_

task: "contrastive"

# ==========================================
# ГРУППА 1: БАЗОВЫЕ НАСТРОЙКИ
# ==========================================
dataset_name: "rag_retriever_train"
seed: ${seed}
max_samples: null
force_reprocess: false

val_size: 0.05
test_size: 0.05

# ==========================================
# ГРУППА 2: ПАРАМЕТРЫ ТРАНСФОРМАЦИЙ
# ==========================================
text_column: null
query_column: "query"
positive_column: "positive_doc"
negative_column: "negative_doc" # Может быть null, если датасет без хард-негативов

max_length: ${max_length}
num_proc: ${system.num_proc}
batch_size: 1000

cleaner:
  _target_: src.rag_pipeline.core.data.cleaners.TextCleaningPipeline
  cleaners: []

# ==========================================
# ГРУППА 3: DATALOADER И ПУТИ
# ==========================================
paths:
  processed_data_dir: "${paths.processed_data_dir}/contrastive"

dataloader:
  batch_size: 16  # Размер батча критичен для MNRL (чем больше, тем лучше in-batch negatives)
  num_workers: ${system.num_workers}
  pin_memory: ${system.pin_memory}