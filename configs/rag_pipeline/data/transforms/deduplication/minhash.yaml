_target_: src.rag_pipeline.core.data.transforms.deduplication.MinHashDeduplicationTransform
# Для indexing-режима дедупликация по тексту документа.
# При необходимости можно добавить несколько колонок — значения склеиваются перед хэшированием.
target_columns:
  - ${rag_pipeline.data.text_column}
num_perm: 128          # Стандартный баланс скорости и точности
threshold: 0.85        # Тексты, совпадающие на 85% по Jaccard, считаются дубликатами
ngram_size: 5          # Окно по 5 словам (шинглы)
num_proc: ${system.num_proc}