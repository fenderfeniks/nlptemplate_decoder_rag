# configs/tg_bot/prod.yaml
# Переопределяет default.yaml для продакшен-режима:
# оркестратор загружает модели в память процесса бота.

use_orchestrator: true
top_k: 5
score_threshold: 0.5
stream_edit_interval: 1.5

messages:
  start: "Привет! Я RAG-ассистент. Задайте вопрос — найду ответ в базе знаний."
  processing: "✨ Ищу информацию и генерирую ответ..."
  error: "Произошла ошибка при обработке запроса. Попробуйте ещё раз."
  empty_result: "К сожалению, не нашёл релевантных документов по вашему запросу."