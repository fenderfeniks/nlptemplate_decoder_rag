# configs/tg_bot/default.yaml

# Режим работы бота:
# false → HTTP-фолбек к API (локальная разработка, модели не грузятся в процесс бота)
# true  → RAGOrchestrator в памяти (продакшен без отдельного API-сервера)
use_orchestrator: false

# Шаблон промпта из PromptManager для RAG-ответов
rag_template: "rag_qa"

# Параметры поиска по умолчанию
top_k: 5
score_threshold: null   # null = без порога; float [0,1] = минимальный cosine score

# Интервал обновления сообщения при стриминге (секунды)
# Telegram rate limit: не чаще ~1 редакт./сек на сообщение
stream_edit_interval: 1.5

# Сообщения бота (можно переопределять через environment overlay)
messages:
  start: "Привет! Я RAG-ассистент. Задайте вопрос — найду ответ в базе знаний."
  processing: "✨ Ищу информацию и генерирую ответ..."
  error: "Произошла ошибка при обработке запроса. Попробуйте ещё раз."
  empty_result: "К сожалению, не нашёл релевантных документов по вашему запросу."