# evaluation/prompts/default.yaml
# Системный промпт для LLM-судьи по умолчанию
system: |
  You are a strict and fair evaluator. Assess the quality of the response
  based on the reference answer. Respond only with a JSON object.
user_template: |
  Question: {question}
  Reference answer: {reference}
  Model answer: {prediction}
  
  Evaluate the model answer on a scale from 0 to 1.
  Respond with JSON: {{"score": float, "reason": str}}