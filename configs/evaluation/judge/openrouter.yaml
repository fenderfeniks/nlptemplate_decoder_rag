# configs/evaluation/judge/openrouter.yaml
_target_: src.tools.evaluation.judges.llm_judge.LLMJudge

# ── Модель ────────────────────────────────────────────────────────────────────
# Любая модель доступная через OpenRouter: https://openrouter.ai/models
model: "google/gemini-flash-1.5"

# ── API ───────────────────────────────────────────────────────────────────────
api_key_env: "OPENROUTER_API_KEY"      # имя переменной окружения с ключом
base_url: "https://openrouter.ai/api/v1"

# ── Что возвращать ────────────────────────────────────────────────────────────
return_score: true
return_reasoning: false
return_verdict: false

# Диапазон скалярной оценки (нормализуется в [0, 1] перед записью в EvalResult)
min_score: 1.0
max_score: 5.0

# ── Генерация ─────────────────────────────────────────────────────────────────
temperature: 0.0
max_tokens: 256

# ── Rate limiting & retry ─────────────────────────────────────────────────────
requests_per_minute: 60    # подбирается под tier вашего OpenRouter-аккаунта
retry_attempts: 3
retry_delay: 5.0           # секунды между попытками (умножается на номер попытки)

# ── Промпт ───────────────────────────────────────────────────────────────────
# system_prompt и user_prompt_template можно переопределить здесь или в override.
# По умолчанию используются встроенные шаблоны из llm_judge.py.
# system_prompt: "You are an expert evaluator..."
# user_prompt_template: "..."