# @package _global_
# configs/environments/prod_rag.yaml
system:
  device: cuda
  accelerator: gpu
  devices: 1
  num_proc: 8
  batch_size: 32
  dataloader_num_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  seed: 42

data:
  max_samples: null

training:
  max_steps: 10000
  val_check_interval: 500
  log_every_n_steps: 10
  accumulate_grad_batches: 1  # для contrastive loss батч и так большой, grad accum обычно не нужен

model:
  architecture:
    embedding_dim: 1024
    max_position_embeddings: 8192

api:
  server:
    cors_origins:
      - "https://твой-домен.com"   # вместо * из shared/server.yaml
  rate_limit:
    enabled: true
    default_limit: "20/minute"