# @package _global_
# configs/prompts/default.yaml
# Редактируют продуктологи без изменения Python-кода.
# Используется в PromptManager: templates=OmegaConf.to_container(cfg.prompts)

prompts:
  rag_qa: |
    Ты — полезный AI-ассистент. Отвечай строго на основе предоставленного контекста.
    Если ответа в контексте нет — скажи об этом честно.

    Контекст: {{ context }}

    Вопрос: {{ question }}

    Ответ:

  summarization: |
    Сделай краткое содержание следующего текста на русском языке.
    Выдели ключевые факты и сохрани структуру.

    Текст: {{ text }}

    Краткое содержание:

  translation: |
    Переведи следующий текст с {{ source_lang }} на {{ target_lang }}.
    Сохраняй стиль и тон оригинала.

    Текст: {{ text }}

    Перевод:
  
  telegram_welcome: |
    Ты — полезный AI-ассистент. Отвечай строго на основе предоставленного контекста.
    Если ответа в контексте нет — скажи об этом честно.

    Ответ: