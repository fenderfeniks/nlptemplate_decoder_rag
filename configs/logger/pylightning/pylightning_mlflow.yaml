# @package logger.pylightning
# configs/logger/pylightning_mlflow.yaml
_target_: pytorch_lightning.loggers.MLFlowLogger

# experiment_name: pipeline_name если задан явно, иначе project_name.
# Переменная среды MLFLOW_EXPERIMENT_NAME перекрывает оба — для CI/CD.
experiment_name: ${pipeline_name}
tracking_uri: ${oc.env:MLFLOW_TRACKING_URI,"sqlite:///${paths.mlflow_bd_dir}/mlflow.db"}
artifact_location: "file:///${paths.log_dir}/mlruns"
run_name: ${now:%Y-%m-%d_%H-%M-%S}
log_model: false
tags:
  env: ${environment.name}
  pipeline: ${pipeline_name}