# @package _global_
# configs/vector_db/qdrant.yaml
# Пример конфига для Qdrant — показывает что server.py не нужно трогать при смене бэкенда.
# При переключении: - vector_db: flat -> - vector_db: qdrant в main.yaml.

vector_db:
  # --- Параметры создания коллекции ---
  _target_: src.vector_store.qdrant_store.QdrantVectorStore
  _recursive_: false
  embedding_dim: 32
  url: ${oc.env:QDRANT_URL,http://localhost:6333}
  collection_name: ${project_name}_kb
  normalize_embeddings: true
  enable_sparse: true        # true — hybrid (dense+BM25), false — только dense
  

  # --- Параметры загрузки (подключение к существующей коллекции) ---
  # Для Qdrant "загрузка" — это просто коннект, directory не нужен.
  # connect() — classmethod который возвращает готовый QdrantVectorStore.
  loader:
    _target_: src.vector_store.qdrant_store.QdrantVectorStore.connect
    embedding_dim: 32
    url: ${oc.env:QDRANT_URL,http://localhost:6333}
    collection_name: ${project_name}_kb
    enable_sparse: ${vector_db.enable_sparse}