# @package _global_
vector_db:
  _target_: src.vector_store.faiss_store.FAISSVectorStore
  embedding_dim: 32
  index_type: "flat"
  # Для flat (IndexFlatIP) нормализация не обязательна семантически,
  # но оставляем true для единообразия с hnsw и корректных cosine scores.
  normalize_embeddings: true
  insert_batch_size: 10000
  filter_fetch_multiplier: 5
  filter_max_fetch_multiplier: 50