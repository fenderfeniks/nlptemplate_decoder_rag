# @package _global_
# configs/vector_db/flat.yaml

vector_db:
  # --- Параметры создания индекса (используется при индексации) ---
  # hydra.utils.instantiate(cfg.vector_db) создаёт новый пустой индекс
  _target_: src.vector_store.faiss_store.FAISSVectorStore
  _recursive_: false
  embedding_dim: 32
  index_type: "flat"
  normalize_embeddings: true
  insert_batch_size: 10000
  filter_fetch_multiplier: 5
  filter_max_fetch_multiplier: 50

  # --- Параметры загрузки (используется при старте сервера) ---
  # hydra.utils.instantiate(cfg.vector_db.loader, directory=cfg.paths.db_dir)
  # загружает существующий индекс с диска.
  # При смене бэкенда: меняем loader._target_ на QdrantVectorStore.connect
  # (или любой другой classmethod/фабрику бэкенда) — server.py не трогаем.
  loader:
    _target_: src.vector_store.faiss_store.FAISSVectorStore.load
    # directory подставляется в server.py из cfg.paths.db_dir — не хардкодим здесь
    embedding_dim: 32
    index_type: "flat"
    normalize_embeddings: true