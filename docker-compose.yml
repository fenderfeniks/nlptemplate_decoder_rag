version: '3.8'

services:
  # ----------------------------------------------------
  # 1. API Gateway (Оркестратор + Telegram Бот)
  # ----------------------------------------------------
  api_gateway:
    image: my-company/nlp_template:latest
    build: 
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_EXTRAS: "api"
    container_name: nlp_template_api_gateway
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    command: ["python", "-m", "src.api_gateway.run_api"]
    environment:
      - PROJECT_ROOT=/app
      - RAG_API_URL=http://rag_api:8001
      - LLM_API_URL=http://llm_api:8000/v1
    env_file:
      - .env
    volumes:
      - ./configs:/app/configs
      - ./logs:/app/logs
    restart: always

  # ----------------------------------------------------
  # 2. RAG API (Векторный поиск и Энкодер)
  # ----------------------------------------------------
  rag_api:
    image: my-company/nlp_template:latest
    container_name: nlp_template_rag_api
    ports:
      - "8001:8001"
    command: ["python", "-m", "scripts.rag_pipeline.run_api"]
    environment:
      - PROJECT_ROOT=/app
      - RAG_API_PORT=8001
    env_file:
      - .env
    volumes:
      - ./configs:/app/configs
      - ./models:/app/models
      - ./vector_db:/app/vector_db
    restart: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ----------------------------------------------------
  # 3. LLM API (Инференс генератора через vLLM)
  # ----------------------------------------------------
  llm_api:
    image: vllm/vllm-openai:latest
    container_name: nlp_template_llm_api
    ports:
      - "8002:8000"
    command: >
      --model ${LLM_MODEL:-facebook/opt-125m}
      --host 0.0.0.0
      --port 8000
      --max-model-len 2048
    volumes:
      - ./models:/app/models
      - ~/.cache/huggingface:/root/.cache/huggingface
    restart: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ----------------------------------------------------
  # 4. Воркер обучения Decoder Pipeline (Batch Job)
  # ----------------------------------------------------
  train_decoder:
    image: my-company/nlp_template:latest
    build: 
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_EXTRAS: "training"
    container_name: nlp_template_train_decoder
    profiles:
      - training
    command: ["python", "-m", "scripts.decoder_pipeline.train"]
    environment:
      - PROJECT_ROOT=/app
    env_file:
      - .env
    volumes:
      - ./configs:/app/configs
      - ~/.cache/huggingface:/root/.cache/huggingface
    restart: "no"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ----------------------------------------------------
  # 5. Воркер обучения RAG Pipeline (Batch Job)
  # ----------------------------------------------------
  train_rag:
    image: my-company/nlp_template:latest
    build: 
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_EXTRAS: "training"
    container_name: nlp_template_train_rag
    profiles:
      - training
    command: ["python", "-m", "scripts.rag_pipeline.train"]
    environment:
      - PROJECT_ROOT=/app
    env_file:
      - .env
    volumes:
      - ./configs:/app/configs
      - ~/.cache/huggingface:/root/.cache/huggingface
    restart: "no"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ----------------------------------------------------
  # 6. Airflow (Оркестратор для локального тестирования DAG-ов)
  # ----------------------------------------------------
  airflow:
    image: apache/airflow:${AIRFLOW_IMAGE_TAG:-2.8.1}
    container_name: nlp_template_airflow
    ports:
      - "8080:8080"
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW_VAR_PROJECT_IMAGE=my-company/nlp_template:api-latest
      - AIRFLOW_VAR_K8S_NAMESPACE=ml-pipelines
    env_file:
      - .env
    volumes:
      - ./dags:/opt/airflow/dags
      - ./deploy/airflow:/opt/airflow/deploy
      - ./logs/airflow:/opt/airflow/logs
    command: >
      bash -c "airflow db migrate &&
               (airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true) &&
               airflow variables import /opt/airflow/deploy/variables.json &&
               airflow standalone"
    restart: unless-stopped

  # ----------------------------------------------------
  # 7. Prometheus (Сбор метрик)
  # ----------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: nlp_template_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    restart: unless-stopped
    depends_on:
      - api_gateway

  # ----------------------------------------------------
  # 8. Grafana (Дашборды)
  # ----------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: nlp_template_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    depends_on:
      - prometheus

  # ----------------------------------------------------
  # 9. Тонкий клиент (Streamlit Demo)
  # ----------------------------------------------------
  demo:
    build:
      context: .
      dockerfile: demo/Dockerfile
    container_name: nlp_template_demo
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api_gateway:8000/api/v1/generate
    depends_on:
      - api_gateway
    restart: unless-stopped

volumes:
  grafana_data: