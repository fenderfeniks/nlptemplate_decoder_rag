volumes:
  grafana_data:
  models_cache:
  minio_data:
  qdrant_data:
  # mlflow_data:  # раскомментировать вместе с training-сервисами

services:

  # ----------------------------------------------------
  # ИНФРАСТРУКТУРА
  # ----------------------------------------------------

  # S3-совместимое хранилище артефактов (веса, манифест, бенчмарки)
  minio:
    image: minio/minio:latest
    container_name: nlp_template_minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web UI (http://localhost:9001)
    environment:
      - MINIO_ROOT_USER=${AWS_ACCESS_KEY_ID:-minioadmin}
      - MINIO_ROOT_PASSWORD=${AWS_SECRET_ACCESS_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Создаёт бакет nlp-storage при первом старте
  minio_init:
    image: minio/mc:latest
    container_name: nlp_template_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${AWS_ACCESS_KEY_ID:-minioadmin} ${AWS_SECRET_ACCESS_KEY:-minioadmin};
        mc mb --ignore-existing local/nlp-storage;
        echo 'Bucket nlp-storage ready.'
      "
    restart: "no"

  # Векторная БД (Qdrant) — персистентные данные на qdrant_data volume
  qdrant:
    image: qdrant/qdrant:latest
    container_name: nlp_template_qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Distributed tracing (Jaeger — all-in-one для dev/staging)
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: nlp_template_jaeger
    ports:
      - "4317:4317"   # OTLP gRPC (куда шлёт api_gateway)
      - "16686:16686" # Jaeger UI (http://localhost:16686)
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped
    profiles:
      - observability
      - full

  # ----------------------------------------------------
  # 0. Init Container (Загрузчик артефактов из S3)
  # ----------------------------------------------------
  artifact_downloader:
    image: my-company/nlp_template:rag-api
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Нужны rag (для Qdrant-клиента при индексации) + training (для резолвера)
        INSTALL_EXTRAS: "api,rag"
    container_name: nlp_template_downloader
    command: ["python", "-m", "scripts.prepare_artifacts"]
    env_file:
      - .env
    environment:
      - PROJECT_ROOT=/app
      # StorageRouter читает endpoint из env
      - AWS_ENDPOINT_URL=http://minio:9000
      - QDRANT_URL=http://qdrant:6333
    volumes:
      - ./configs:/app/configs
      - models_cache:/app/models
    restart: "no"
    depends_on:
      minio_init:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy

  # ----------------------------------------------------
  # 1. LLM API (vLLM — OpenAI-совместимый инференс)
  # ----------------------------------------------------
  llm_api:
    image: vllm/vllm-openai:latest
    container_name: nlp_template_llm_api
    ports:
      - "8002:8000"
    command: >
      --model /app/models/merged_models/decoder_model
      --host 0.0.0.0
      --port 8000
      --max-model-len 2048
    volumes:
      - models_cache:/app/models
      - ~/.cache/huggingface:/root/.cache/huggingface
    restart: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      artifact_downloader:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ----------------------------------------------------
  # 2. RAG API (Энкодер + Qdrant-ретривер)
  # ----------------------------------------------------
  rag_api:
    image: my-company/nlp_template:rag-api
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # api — FastAPI/uvicorn, rag — Qdrant/FAISS/fastembed
        INSTALL_EXTRAS: "api,rag"
    container_name: nlp_template_rag_api
    ports:
      - "8001:8001"
    command: ["python", "-m", "scripts.rag_pipeline.run_api"]
    env_file:
      - .env
    environment:
      - PROJECT_ROOT=/app
      - RAG_API_PORT=8001
      - AWS_ENDPOINT_URL=http://minio:9000
      - QDRANT_URL=http://qdrant:6333
      # OTEL → Jaeger (опционально, можно убрать если jaeger не поднят)
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_SERVICE_NAME=rag-api
    volumes:
      - ./configs:/app/configs
      - models_cache:/app/models
      # vector_db_cache убран: данные персистентны в Qdrant, не на диске
    restart: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      artifact_downloader:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy

  # ----------------------------------------------------
  # 3. API Gateway (Оркестратор RAG + LLM)
  # ----------------------------------------------------
  api_gateway:
    image: my-company/nlp_template:api
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Gateway не грузит модели сам — только HTTP-клиент + observability
        INSTALL_EXTRAS: "api"
    container_name: nlp_template_api_gateway
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    command: ["python", "-m", "scripts.api"]
    env_file:
      - .env
    environment:
      - PROJECT_ROOT=/app
      - RAG_API_URL=http://rag_api:8001
      - LLM_API_URL=http://llm_api:8000/v1
      - AWS_ENDPOINT_URL=http://minio:9000
      # Манифест читается из S3, а не с диска — убран volume prod_storage
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_SERVICE_NAME=api-gateway
    volumes:
      - ./configs:/app/configs
      - ./logs:/app/logs
    restart: always
    depends_on:
      llm_api:
        condition: service_healthy
      rag_api:
        condition: service_started

