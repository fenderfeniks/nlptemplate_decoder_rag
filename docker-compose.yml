version: '3.8'

# Общие volumes для шаринга моделей между контейнером-загрузчиком и API
volumes:
  grafana_data:
  models_cache:
  vector_db_cache:
  mlflow_data:

services:
  # ----------------------------------------------------
  # 0. Init Container (Загрузчик моделей)
  # ----------------------------------------------------
  artifact_downloader:
    image: my-company/nlp_template:latest
    build: 
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_EXTRAS: "api"
    container_name: nlp_template_downloader
    command: ["python", "-m", "scripts.download_artifacts"]
    environment:
      - PROJECT_ROOT=/app
    env_file:
      - .env
    volumes:
      - ./configs:/app/configs # Для локальной разработки, если меняем конфиги на лету
      - models_cache:/app/models
      - vector_db_cache:/app/vector_db
      - ./prod_storage:/app/prod_storage # Если используем LocalStorage как source
    restart: "no" # Отрабатывает один раз и выключается

  # ----------------------------------------------------
  # 1. LLM API (Инференс генератора через vLLM)
  # ----------------------------------------------------
  llm_api:
    image: vllm/vllm-openai:latest
    container_name: nlp_template_llm_api
    ports:
      - "8002:8000"
    command: >
      --model /app/models/decoder_cache/merged_model
      --host 0.0.0.0
      --port 8000
      --max-model-len 2048
    volumes:
      - models_cache:/app/models
      - ~/.cache/huggingface:/root/.cache/huggingface
    restart: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      artifact_downloader:
        condition: service_completed_successfully

  # ----------------------------------------------------
  # 2. RAG API (Векторный поиск и Энкодер)
  # ----------------------------------------------------
  rag_api:
    image: my-company/nlp_template:latest
    container_name: nlp_template_rag_api
    ports:
      - "8001:8001"
    command: ["python", "-m", "scripts.rag_pipeline.run_api"]
    environment:
      - PROJECT_ROOT=/app
      - RAG_API_PORT=8001
    env_file:
      - .env
    volumes:
      - ./configs:/app/configs
      - models_cache:/app/models
      - vector_db_cache:/app/vector_db
    restart: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      artifact_downloader:
        condition: service_completed_successfully

  # ----------------------------------------------------
  # 3. API Gateway (Оркестратор)
  # ----------------------------------------------------
  api_gateway:
    image: my-company/nlp_template:latest
    container_name: nlp_template_api_gateway
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    command: ["python", "-m", "scripts.api"]
    environment:
      - PROJECT_ROOT=/app
      - RAG_API_URL=http://rag_api:8001
      - LLM_API_URL=http://llm_api:8000/v1
    env_file:
      - .env
    volumes:
      - ./configs:/app/configs
      - ./logs:/app/logs
    restart: always
    depends_on:
      llm_api:
        condition: service_started
      rag_api:
        condition: service_started

  # ----------------------------------------------------
  # Инфраструктура MLOps
  # ----------------------------------------------------
  mlflow:
    image: my-company/nlp_template:latest
    container_name: nlp_template_mlflow
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    command: >
      mlflow ui
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root /mlflow/mlartifacts
      --host 0.0.0.0
      --port 5000
    volumes:
      - mlflow_data:/mlflow
    restart: unless-stopped
    profiles:
      - training
      - mlflow

  # ----------------------------------------------------
  # Training сервисы — добавить volume mlflow и MLFLOW_TRACKING_URI
  # ----------------------------------------------------
  train_decoder:
    image: my-company/nlp_template:latest
    build:
      context: .
      args:
        INSTALL_EXTRAS: "training"
    container_name: nlp_template_train_decoder
    profiles:
      - training
    command: ["python", "-m", "scripts.decoder_pipeline.train"]
    environment:
      - PROJECT_ROOT=/app
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    env_file:
      - .env
    volumes:
      - ./configs:/app/configs
      - ~/.cache/huggingface:/root/.cache/huggingface
      - mlflow_data:/mlflow  # <- шарим volume
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      - mlflow

  train_rag:                                    
    image: my-company/nlp_template:latest
    container_name: nlp_template_train_rag
    profiles:
      - training
    command: ["python", "-m", "scripts.rag_pipeline.train"]
    environment:
      - PROJECT_ROOT=/app
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    env_file:
      - .env
    volumes:
      - ./configs:/app/configs
      - ~/.cache/huggingface:/root/.cache/huggingface
      - mlflow_data:/mlflow
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      - mlflow

  prometheus:
    image: prom/prometheus:latest
    container_name: nlp_template_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    restart: unless-stopped
    depends_on:
      - api_gateway

  grafana:
    image: grafana/grafana:latest
    container_name: nlp_template_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    depends_on:
      - prometheus