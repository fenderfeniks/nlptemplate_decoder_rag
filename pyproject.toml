[tool.poetry]
name = "industrial-nlp-template"
version = "1.0.0"
description = "Production-ready NLP framework with Hydra, RAG, and FastAPI"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "src"}]

# ==========================================
# БАЗОВЫЙ МИНИМУМ (Ядро)
# Устанавливается всегда. Нужен для любой задачи.
# ==========================================
[tool.poetry.dependencies]
python = "^3.10"
torch = ">=2.0.0"                  # Ядро вычислений
transformers = ">=4.38.0"          # Работа с LLM
hydra-core = "^1.3.2"              # Конфигурация
pydantic = "^2.6.0"                # Валидация
python-dotenv = "^1.0.0"           # Секреты
accelerate = "^0.27.0"             # Для работы с девайсами (device_map)

# ==========================================
# ГРУППА 1: ОБУЧЕНИЕ (Training)
# Ставится только там, где запускается train.py
# ==========================================
[tool.poetry.group.training.dependencies]
pytorch-lightning = "^2.2.0"
mlflow = "^2.10.0"
torchmetrics = "^1.3.0"
peft = "^0.8.2"                    # LoRA / QLoRA
bitsandbytes = "^0.42.0"           # Квантизация 4-bit / 8-bit
datasets = "^2.17.0"               # Загрузка данных из HuggingFace

# ==========================================
# ГРУППА 2: RAG (Векторные базы и Поиск)
# Ставится, если нужен модуль базы знаний
# ==========================================
[tool.poetry.group.rag.dependencies]
llama-index-core = "^0.10.0"
llama-index-embeddings-huggingface = "^0.1.3"
llama-index-vector-stores-faiss = "^0.1.1"
llama-index-vector-stores-qdrant = "^0.1.2"
faiss-cpu = "^1.7.4"               # Заменить на faiss-gpu для обучения на видеокартах
qdrant-client = "^1.7.1"

# ==========================================
# ГРУППА 3: INFERENCE (API и Боты)
# Ставится на продакшен серверах (run_api.py)
# ==========================================
[tool.poetry.group.inference.dependencies]
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
aiogram = "^3.4.0"
aiohttp = "^3.9.3"

# ==========================================
# ГРУППА 4: РАЗРАБОТКА (Dev Tools)
# Ставится только программистам для написания кода
# ==========================================
[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
ruff = "^0.3.0"                    # Ультра-быстрый линтер (замена flake8 + black)
mypy = "^1.8.0"                    # Тайп-чекинг
jupyterlab = "^4.1.0"              # Для экспериментов в ноутбуках

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# Настройки линтера Ruff (Индустриальный стандарт 2024 года)
[tool.ruff]
line-length = 100
target-version = "py310"