# pyproject.toml
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "decoder_template"
version = "1.0.0"
description = "Production-ready NLP Classification framework with Hydra, FastAPI and uv"
readme = "README.md"
requires-python = ">=3.10, <3.12"

# ==========================================
# БАЗОВЫЙ МИНИМУМ (Ядро)
# Только то, без чего не запускается вообще ничего:
# конфигурация, логирование, базовые ML-примитивы.
# ==========================================
dependencies = [
    # ML-ядро
    "torch>=2.0.0",
    "transformers>=4.38.0",
    "huggingface-hub>=0.21.0",
    "numpy>=1.24.0",
    # Конфигурация и валидация
    "hydra-core>=1.3.2",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    # Логирование и инфраструктура
    "python-json-logger>=2.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "sacrebleu>=2.6.0",
]

[project.optional-dependencies]

# ==========================================
# ГРУППА 0: INFERENCE-CORE
# Минимум для запуска модели из MLflow-артефакта.
# Экспортируется как requirements для артефакта модели.
# ==========================================
inference-core = [
    "torch>=2.0.0",
    "transformers>=4.38.0",
]

# ==========================================
# ГРУППА 1: DATA
# Подготовка и версионирование датасетов.
# ==========================================
data = [
    "datasets>=2.17.0",
    "datasketch>=2.0.0",      # MinHash-дедупликация корпусов
    "dvc[gdrive]>=3.67.1",    # Версионирование данных
    "pyopenssl>=26.2.0",      # OAuth для dvc[gdrive]
    "cryptography>=48.0.1",   # OAuth для dvc[gdrive]
]

# ==========================================
# ГРУППА 2: ОБУЧЕНИЕ (Training)
# ==========================================
training = [
    "decoder-template[data]",           # Датасеты нужны при обучении
    "pytorch-lightning>=2.2.0",
    "mlflow>=2.10.0",
    "torchmetrics>=1.3.0",
    "accelerate>=0.27.0",               # Multi-GPU, mixed precision
    "peft>=0.8.2",                      # LoRA / адаптеры
    "bitsandbytes>=0.46.1",             # Квантизация (QLoRA)
    "evaluate>=0.4.0",
    "nltk>=3.10.0",                     # NLP-метрики
    "rouge-score>=0.1.2",               # ROUGE для seq2seq
    "absl-py>=2.5.0",                   # Зависимость rouge-score
    "kaggle>=1.6.0",
]

# ==========================================
# ГРУППА 3: INFERENCE (API и Боты)
# ==========================================
api = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "starlette>=0.36.0",
    "aiogram>=3.4.0",
    "aiohttp>=3.9.3",
    "redis>=8.0.1",                                   # Кэш / rate limiting
    "prometheus-fastapi-instrumentator>=6.1.0",
    "prometheus-client>=0.20.0",
    "slowapi>=0.1.9",
]

# ==========================================
# ГРУППА 4: ОРКЕСТРАЦИЯ (Airflow)
# ==========================================
orchestration = [
    "apache-airflow>=2.8.0",
    "apache-airflow-providers-cncf-kubernetes>=8.0.0",
    "apache-airflow-providers-slack>=8.6.0",
    "pendulum>=3.0.0",
]

# ==========================================
# ГРУППА 5: EDA (Notebooks)
# ==========================================
experimentation = [
    "jupyterlab>=4.1.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "scikit-learn>=1.3.0",
]

# ==========================================
# ГРУППА 6: РАЗРАБОТКА (Dev Tools)
# ==========================================
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "decoder-template[experimentation]",
]

# ==========================================
# ГРУППА 7: HPO (Подбор гиперпараметров)
# ==========================================
tune = [
    "optuna>=3.6.0",
    "optuna-integration>=3.6.0",
]

# ==========================================
# ГРУППА 8: DEMO
# ==========================================
demo = [
    "streamlit>=1.32.0",
    "requests>=2.31.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"

# ==========================================
# НАСТРОЙКИ ЛИНТЕРА RUFF
# ==========================================
[tool.ruff]
line-length = 100
target-version = "py310"

exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    "__pypackages__",
    "build",
    "dist",
    "venv",
    "mlruns",
    "models",
    "data",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "UP", # pyupgrade
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
]

ignore = [
    "B008", # Разрешает вызовы функций в аргументах (FastAPI Depends)
    "E501", # Игнорируем жёсткое ограничение длины строки
]

unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["src"]
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.hatch.build.targets.wheel]
packages = ["src"]
