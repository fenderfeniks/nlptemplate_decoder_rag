# pyproject.toml
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "industrial_nlp_template"
version = "1.0.0"
description = "Production-ready NLP framework with Hydra, RAG, FastAPI and uv"
readme = "README.md"
requires-python = ">=3.10"

# ==========================================
# БАЗОВЫЙ МИНИМУМ (Ядро)
# Устанавливается всегда. Нужен для любой задачи.
# ==========================================
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.38.0",
    "hydra-core>=1.3.2",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "accelerate>=0.27.0"
]

[project.optional-dependencies]

# ==========================================
# ГРУППА 1: ОБУЧЕНИЕ (Training)
# ==========================================
training = [
    "pytorch-lightning>=2.2.0",
    "mlflow>=2.10.0",
    #"wandb>=0.16.0",             # <-- ДОБАВЛЕНО (Мы прокинули WANDB_API_KEY в Airflow DAG)
    "torchmetrics>=1.3.0",
    "peft>=0.8.2",
    "bitsandbytes>=0.42.0",
    "datasets>=2.17.0"
]

# ==========================================
# ГРУППА 2: RAG (Векторные базы и Поиск)
# ==========================================
rag = [
    "llama-index-core>=0.10.0",
    "llama-index-embeddings-huggingface>=0.1.3",
    "llama-index-vector-stores-faiss>=0.1.1",
    "llama-index-vector-stores-qdrant>=0.1.2",
    "llama-index-readers-file>=0.1.4", # <-- ДОБАВЛЕНО (Нужно для SimpleDirectoryReader в rag_update_job.py)
    "faiss-cpu>=1.7.4",              
    "qdrant-client>=1.7.1"
]

# ==========================================
# ГРУППА 3: INFERENCE (API и Боты)
# ==========================================
api = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "aiogram>=3.4.0",
    "aiohttp>=3.9.3",
    "prometheus-fastapi-instrumentator>=6.1.0",
    "prometheus-client>=0.20.0"  # <-- ДОБАВЛЕНО (Мы явно импортируем Counter и Histogram в metrics.py)
]

# ==========================================
# ГРУППА 4: ОРКЕСТРАЦИЯ (Airflow)
# Ставится для локальной разработки и тестирования DAG-ов
# ==========================================
orchestration = [
    "apache-airflow>=2.8.0",
    "apache-airflow-providers-cncf-kubernetes>=8.0.0", # <-- ДОБАВЛЕНО (Для KubernetesPodOperator)
    "apache-airflow-providers-slack>=8.6.0"            # <-- ДОБАВЛЕНО (Для SlackWebhookOperator в quality_control)
]

# ==========================================
# ГРУППА 5: РАЗРАБОТКА (Dev Tools)
# ==========================================
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "jupyterlab>=4.1.0"
]

# Настройки линтера Ruff
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.hatch.build.targets.wheel]
packages = ["src"]