# pyproject.toml
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "industrial_nlp_template"
version = "1.0.0"
description = "Production-ready NLP framework with Hydra, RAG, FastAPI and uv"
readme = "README.md"
requires-python = ">=3.10"

# ==========================================
# БАЗОВЫЙ МИНИМУМ (Ядро)
# Устанавливается всегда. Нужен для любой задачи.
# ==========================================
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.38.0",
    "hydra-core>=1.3.2",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "accelerate>=0.27.0"
]

# ==========================================
# ГРУППА 1: ОБУЧЕНИЕ (Training)
# Ставится только там, где запускается train.py
# ==========================================
[project.optional-dependencies]

training = [
    "pytorch-lightning>=2.2.0",
    "mlflow>=2.10.0",
    "torchmetrics>=1.3.0",
    "peft>=0.8.2",
    "bitsandbytes>=0.42.0",
    "datasets>=2.17.0"
]

# ==========================================
# ГРУППА 2: RAG (Векторные базы и Поиск)
# Ставится, если нужен модуль базы знаний
# ==========================================
rag = [
    "llama-index-core>=0.10.0",
    "llama-index-embeddings-huggingface>=0.1.3",
    "llama-index-vector-stores-faiss>=0.1.1",
    "llama-index-vector-stores-qdrant>=0.1.2",
    "faiss-cpu>=1.7.4",             # Заменить на faiss-gpu для обучения на видеокартах
    "qdrant-client>=1.7.1"
]

# ==========================================
# ГРУППА 3: INFERENCE (API и Боты)
# Ставится на продакшен серверах (run_api.py)
# ==========================================

api = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "aiogram>=3.4.0",
    "aiohttp>=3.9.3"
]

# ==========================================
# ГРУППА 4: РАЗРАБОТКА (Dev Tools)
# Ставится только программистам для написания кода
# ==========================================

dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "jupyterlab>=4.1.0"              # Для экспериментов в ноутбуках
]

# Настройки линтера Ruff
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.hatch.build.targets.wheel]
packages = ["src"]