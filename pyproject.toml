# pyproject.toml
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[project]
name = "decoder_template"
version = "1.0.0"
description = "Production-ready NLP Classification framework with Hydra, FastAPI and uv"
readme = "README.md"
requires-python = ">=3.10, <3.12"

# ==========================================
# БАЗОВЫЙ МИНИМУМ (Ядро)
# Только то, без чего не запускается вообще ничего:
# конфигурация, логирование, хранилище артефактов.
# ==========================================
dependencies = [
    # Конфигурация и валидация
    "hydra-core>=1.3.2",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "omegaconf>=2.3.1",
    # Логирование
    "python-json-logger>=2.0.0",
    # Хранилище артефактов (S3 / MinIO)
    "boto3>=1.43.64",
    # Шаблонизатор (промпты)
    "jinja2>=3.1.6",
    # Прогресс-бары
    "tqdm>=4.69.1",
    # tomli нужен только до Python 3.11 (в 3.11+ встроен tomllib)
    "tomli>=2.0.0; python_version < '3.11'",
    # PyYAML нужен для чтения конфигов вне Hydra (например server.py)
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]

# ==========================================
# ГРУППА: INFERENCE-CORE
# Минимум для запуска модели из MLflow-артефакта.
# Экспортируется как requirements для артефакта модели.
# ==========================================
inference-core = [
    "torch>=2.0.0",
    "transformers>=4.38.0",
    "huggingface-hub>=0.21.0",
    "numpy>=1.24.0",
]

# ==========================================
# ГРУППА: RAG
# Векторные базы данных и энкодеры.
# RAG API грузит модели — нужен inference-core (torch + transformers).
# ==========================================
rag = [
    "decoder-template[inference-core]",
    "qdrant-client>=1.19.0",
    "fastembed>=0.8.0",          # BM25 sparse-векторы для Qdrant
]

# ==========================================
# ГРУППА: OBSERVABILITY
# Метрики, трейсинг, circuit breaker.
# Нужна api-сервисам и gateway.
# ==========================================
observability = [
    "prometheus-client>=0.20.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "pybreaker>=1.4.1",
]

# ==========================================
# ГРУППА: DATA
# Подготовка и версионирование датасетов.
# ==========================================
data = [
    "datasets>=2.17.0",
    "datasketch>=2.0.0",      # MinHash-дедупликация корпусов
    "dvc[gdrive]>=3.67.1",    # Версионирование данных
    "kaggle>=1.6.0",
]

# ==========================================
# ГРУППА: TRAINING
# Обучение моделей.
# ==========================================
training = [
    "decoder-template[inference-core]",  # torch + transformers
    "decoder-template[data]",            # Датасеты нужны при обучении
    "pytorch-lightning>=2.2.0",
    "mlflow>=2.10.0",
    "torchmetrics>=1.3.0",
    "accelerate>=0.27.0",               # Multi-GPU, mixed precision
    "peft>=0.8.2",                      # LoRA / адаптеры
    "bitsandbytes>=0.46.1",             # Квантизация (QLoRA)
    "autoawq>=0.2.9",                   # AWQ-квантизация (только при обучении/экспорте)
    "evaluate>=0.4.0",
    "rouge-score>=0.1.2",               # ROUGE для eval
    "sacrebleu>=2.6.0",                 # BLEU для eval
    "absl-py>=2.5.0",                   # Зависимость rouge-score
]

# ==========================================
# ГРУППА: API
# FastAPI-сервисы: RAG API, Gateway, Telegram-бот.
# ==========================================
api = [
    "decoder-template[observability]",  # Метрики и трейсинг нужны всем сервисам
    "fastapi>=0.110.0",
    "starlette>=0.36.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.27.0",
    "prometheus-fastapi-instrumentator>=6.1.0",
    "openai>=2.51.0",                   # OpenAI-совместимый клиент (vLLM / llama.cpp)
    "aiogram>=3.4.0",                   # Telegram-бот
    "aiohttp>=3.9.3",
    "redis>=8.0.1",
    "slowapi>=0.1.9",                   # Rate limiting
]

# ==========================================
# ГРУППА: ORCHESTRATION
# Airflow DAGи.
# ==========================================
orchestration = [
    "apache-airflow>=2.8.0",
    "apache-airflow-providers-cncf-kubernetes>=8.0.0",
    "apache-airflow-providers-slack>=8.6.0",
    "pendulum>=3.0.0",
]

# ==========================================
# ГРУППА: EXPERIMENTATION
# Ноутбуки и EDA.
# ==========================================
experimentation = [
    "jupyterlab>=4.1.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "scikit-learn>=1.3.0",
]

# ==========================================
# ГРУППА: DEV
# Инструменты разработки.
# ==========================================
dev = [
    "decoder-template[experimentation]",
    "pytest>=8.0.0",
    "pytest-cov",
    "pytest-asyncio>=0.24.0",
    "pytest-mock",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

# ==========================================
# ГРУППА: DEMO
# Streamlit-демо.
# ==========================================
demo = [
    "streamlit>=1.32.0",
    "requests>=2.31.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
filterwarnings = [
    "ignore::pytest.PytestUnraisableExceptionWarning",
    "ignore::DeprecationWarning"
]

[tool.uv]
override-dependencies = [
    "triton ; sys_platform != 'win32'",
]

# ==========================================
# НАСТРОЙКИ ЛИНТЕРА RUFF
# ==========================================
[tool.ruff]
line-length = 100
target-version = "py310"

exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    "__pypackages__",
    "build",
    "dist",
    "venv",
    "mlruns",
    "models",
    "data",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "UP", # pyupgrade
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
]

ignore = [
    "B008", # Разрешает вызовы функций в аргументах (FastAPI Depends)
    "E501", # Игнорируем жёсткое ограничение длины строки
]

unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["src", "pipelines"]
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ==========================================
# НАСТРОЙКИ DEPTRY
# ==========================================
[tool.deptry]
known_first_party = ["src", "pipelines"]

[tool.deptry.per_rule_ignores]
# tomllib встроен в Python 3.11+
DEP001 = ["tomllib"]

DEP002 = [
    "dvc", "uvicorn", "apache-airflow", "apache-airflow-providers-cncf-kubernetes",
    "apache-airflow-providers-slack", "pendulum", "streamlit",
    "torchmetrics", "accelerate", "bitsandbytes",
    "scikit-learn", "matplotlib", "seaborn",
    "aiohttp", "requests", "redis",
    "jupyterlab", "pytest", "pytest-asyncio", "ruff", "mypy", "decoder-template"
]